<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mock-up A: margin doodles</title>
<style>
:root{--ground:#f4f6fa;--ink:#141c2b;--paper:#fbf4de;--rule:rgba(60,104,170,.22);--pen:#0b4f9c;--kraft:#b58b55;--brand:#007bff;--hi:#ffe94d;--hand:"Segoe Print","Bradley Hand","Comic Sans MS",cursive}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--ground);color:var(--ink);font:400 16px/1.5 system-ui,sans-serif;display:grid;place-items:center}
.phone{position:relative;width:min(100vw,390px);height:min(100dvh,800px);overflow:hidden;background:var(--ground)}
.bar{position:absolute;inset:0 0 auto;height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-weight:800}
.bar small{font:500 12px var(--hand);color:#5a6578}
.book{position:absolute;left:16px;right:30px;top:54px;bottom:112px;background:var(--kraft);border:2px solid var(--ink);border-radius:6px;box-shadow:4px 4px 0 var(--ink);padding:0 6px 6px 0}
.sheet{position:absolute;inset:0 6px 6px 0;background:var(--paper);border:2px solid rgba(20,28,43,.55);border-radius:3px;overflow:hidden;
 background-image:linear-gradient(90deg,transparent 30px,rgba(200,64,52,.42) 30px 31.5px,transparent 31.5px),repeating-linear-gradient(transparent 0 25px,var(--rule) 25px 26px);background-position:0 0,0 14px}
.page{position:absolute;inset:0;padding:20px 46px 56px 40px;overflow:auto;display:none}
.page.on{display:block}
.k{display:inline-block;font:700 11px/1.4 ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;background:#f4ecd8;padding:3px 8px;rotate:-1.2deg;box-shadow:0 1px 0 rgba(0,0,0,.2)}
h2{margin:10px 0 6px;font:800 22px/1.2 system-ui;background:linear-gradient(transparent 85%,var(--pen) 85% 92%,transparent 92%)}
.page p{margin:0 0 10px;font-size:15px;line-height:26px}
.ph{font-family:var(--hand);color:#6b5b45}
/* margin doodles: pencil-thin drawings in the right margin; tap one and it answers */
.doodle{position:absolute;right:6px;width:40px;height:40px;border:0;padding:0;background:none;cursor:pointer;opacity:.55;transition:opacity .2s,transform .2s}
.doodle svg{width:100%;height:100%;fill:none;stroke:var(--pen);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.doodle:hover,.doodle:focus-visible{opacity:1}
.doodle:focus-visible{outline:2.5px solid #0062cc;outline-offset:2px;border-radius:8px}
.doodle.wiggle{animation:wig 1.2s ease-in-out 2}
@keyframes wig{0%,100%{rotate:0deg}25%{rotate:-12deg}60%{rotate:10deg}}
.doodle.found{opacity:1}
.doodle.found svg{stroke:#c84034;stroke-width:2.4}
.note{position:absolute;right:46px;width:190px;padding:10px 12px;background:#fff7a8;border:1px solid rgba(0,0,0,.2);box-shadow:3px 3px 0 rgba(20,28,43,.3);font:15px/1.3 var(--hand);color:#3a3226;rotate:-2deg;
 transform-origin:100% 0;animation:unfold .28s ease-out;z-index:5}
.note b{display:block;font:700 10px ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;margin-bottom:4px;color:#8a6d00}
@keyframes unfold{from{scale:.2;opacity:0}to{scale:1;opacity:1}}
.pn{position:absolute;left:40px;right:46px;bottom:14px;display:flex;justify-content:space-between;align-items:center;font:500 11px ui-monospace,monospace;letter-spacing:.08em;color:rgba(20,28,43,.65);pointer-events:none;z-index:6}
/* the finds counter: nine pencil ticks along the foot of every page, one per doodle in the book */
.finds{display:flex;gap:4px;align-items:center}
.finds i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ink);background:none}
.finds i.on{background:#c84034;border-color:#c84034}
.finds span{margin-left:6px}
.stamp{position:absolute;left:50%;top:44%;translate:-50% -50%;rotate:-9deg;border:3px double #c84034;color:#c84034;padding:8px 14px;font:800 20px/1 system-ui;letter-spacing:.1em;text-transform:uppercase;border-radius:6px;opacity:0;pointer-events:none;z-index:8}
.stamp.on{animation:stamp .5s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes stamp{from{scale:2.2;opacity:0}to{scale:1;opacity:.9}}
.wheel{position:absolute;left:50%;bottom:-130px;width:240px;height:240px;margin-left:-120px;border-radius:50%;background:var(--brand);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink)}
.wheel b{position:absolute;left:0;right:0;top:20px;text-align:center;color:#fff;font:800 18px system-ui}
.wheel .row{position:absolute;left:0;right:0;top:56px;display:flex;justify-content:center;gap:10px}
.wheel button{width:44px;height:44px;border-radius:50%;border:2px solid var(--ink);background:#fff;font:800 18px system-ui;cursor:pointer}
.wheel button:focus-visible{outline:3px solid #fff;outline-offset:2px}
</style>
</head>
<body>
<div class="phone" id="phone">
  <div class="bar"><span>David Lybeck</span><small>mock-up A · margin doodles</small></div>
  <div class="book"><div class="sheet" id="sheet"></div></div>
  <div class="wheel"><b id="wname">Work</b><div class="row"><button id="prev" aria-label="Previous page">&larr;</button><button id="next" aria-label="Next page">&rarr;</button></div></div>
</div>
<script>
/* Sample words only: the real notes would be David's. Nine doodles over five pages. */
const PAGES=[
 {id:'work',name:'Work',kicker:'8 roles',lines:['From coaching tennis to building AI tools.','A few lines of the real page sit here, exactly as written today.','The doodles live in the margin and never touch the words.'],
  d:[{top:70,icon:'plane',title:'Paper plane',text:'a short aside from David about this job'},{top:300,icon:'coffee',title:'Coffee ring',text:'a thing he learned there, one line'}]},
 {id:'scribble',name:'ScribbleScan',kicker:'2025 to now',lines:['Handwriting digitization, from a hosted product to a privacy-first experiment.','High level only; the doodle never goes deeper than the page does.'],
  d:[{top:120,icon:'pencil',title:'Pencil',text:'what the first version got wrong'},{top:340,icon:'eye',title:'Eye',text:'one thing nobody sees in the product'}]},
 {id:'tennis',name:'Tennis',kicker:'since middle school',lines:['I’ve played for as long as I remember.','Let me know if you want to hit.'],
  d:[{top:100,icon:'ball',title:'Ball',text:'a favourite shot, in his words'}]},
 {id:'printing',name:'3D printing',kicker:'puzzles and models',lines:['Puzzle boxes I designed.','I bet you can’t solve them.'],
  d:[{top:90,icon:'key',title:'Key',text:'a hint for the puzzle box'},{top:320,icon:'cube',title:'Cube',text:'the failed print he kept'}]},
 {id:'gaming',name:'Gaming',kicker:'shorter games',lines:['Some of my favorites.','I’ll race you in Mario Kart Wii.'],
  d:[{top:110,icon:'star',title:'Star',text:'a shell he still talks about'},{top:330,icon:'ball',title:'Shell',text:'the track he always picks'}]},
];
const ICONS={
 plane:'<path d="M4 20 36 6 26 34 19 24 4 20Z"/><path d="M19 24 36 6"/>',
 coffee:'<path d="M8 14h20v12a8 8 0 0 1-8 8h-4a8 8 0 0 1-8-8V14Z"/><path d="M28 18h4a4 4 0 0 1 0 8h-4"/><path d="M14 4c-2 3 2 4 0 7M21 4c-2 3 2 4 0 7"/>',
 pencil:'<path d="M6 34 8 26 28 6l6 6L14 32l-8 2Z"/><path d="M24 10l6 6"/>',
 eye:'<path d="M3 20s6-10 17-10 17 10 17 10-6 10-17 10S3 20 3 20Z"/><circle cx="20" cy="20" r="5"/>',
 ball:'<circle cx="20" cy="20" r="15"/><path d="M7 11c7 4 7 14 0 18M33 11c-7 4-7 14 0 18"/>',
 key:'<circle cx="12" cy="20" r="7"/><path d="M19 20h17M30 20v6M35 20v4"/>',
 cube:'<path d="M20 4 35 12v16L20 36 5 28V12L20 4Z"/><path d="M5 12l15 8 15-8M20 20v16"/>',
 star:'<path d="m20 4 5 11 12 1-9 8 3 12-11-6-11 6 3-12-9-8 12-1 5-11Z"/>'};
const KEY='mockA-found';
let found={};try{found=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const total=PAGES.reduce((n,p)=>n+p.d.length,0);
const sheet=document.getElementById('sheet');let cur=0;
const stampEl=document.createElement('div');stampEl.className='stamp';stampEl.textContent='Found the lot';sheet.after(stampEl);
function count(){return Object.keys(found).length}
function ticks(){return '<span class="finds" aria-label="'+count()+' of '+total+' found">'+Array.from({length:total},(_,i)=>'<i class="'+(i<count()?'on':'')+'"></i>').join('')+'<span>'+count()+'/'+total+'</span></span>'}
function render(){
  sheet.innerHTML=PAGES.map((p,i)=>{
    const body=p.lines.map(l=>'<p>'+l+'</p>').join('');
    const dd=p.d.map((d,j)=>{const k=p.id+j;return '<button class="doodle'+(found[k]?' found':'')+'" data-k="'+k+'" style="top:'+d.top+'px" aria-label="'+(found[k]?'Doodle found: '+d.title:'A doodle in the margin')+'"><svg viewBox="0 0 40 40">'+ICONS[d.icon]+'</svg></button>'}).join('');
    return '<section class="page'+(i===cur?' on':'')+'" data-i="'+i+'" aria-label="'+p.name+'"><span class="k">'+p.name+' &middot; '+p.kicker+'</span><h2>'+p.name+'</h2>'+body+'<p class="ph">[sample words; the real page goes here]</p>'+dd+'<div class="pn"><span>p.'+(i+7)+'</span>'+ticks()+'</div></section>';
  }).join('');
  document.getElementById('wname').textContent=PAGES[cur].name;
  idle();
}
function reveal(btn){
  const k=btn.dataset.k;const p=PAGES.find(p=>k.startsWith(p.id)&&!isNaN(k.slice(p.id.length)));const d=p.d[+k.slice(p.id.length)];
  sheet.querySelectorAll('.note').forEach(n=>n.remove());
  if(!found[k]){found[k]=1;try{localStorage.setItem(KEY,JSON.stringify(found))}catch(e){}}
  btn.classList.add('found');
  const n=document.createElement('div');n.className='note';n.style.top=(parseInt(btn.style.top)+36)+'px';
  n.innerHTML='<b>'+d.title+' &middot; found '+count()+' of '+total+'</b>'+d.text;n.setAttribute('role','status');
  btn.closest('.page').append(n);
  sheet.querySelectorAll('.finds').forEach(f=>f.outerHTML=ticks());
  if(count()===total){stampEl.classList.remove('on');void stampEl.offsetWidth;stampEl.classList.add('on')}
}
sheet.addEventListener('click',e=>{const b=e.target.closest('.doodle');if(b)reveal(b);else sheet.querySelectorAll('.note').forEach(n=>n.remove())});
function go(d){cur=(cur+d+PAGES.length)%PAGES.length;render()}
document.getElementById('prev').onclick=()=>go(-1);document.getElementById('next').onclick=()=>go(1);
addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1)});
/* a quiet nudge: after a few seconds on a page, one unfound doodle wiggles twice. Nothing is announced. */
let t;function idle(){clearTimeout(t);t=setTimeout(()=>{const b=sheet.querySelector('.page.on .doodle:not(.found)');if(b&&!matchMedia('(prefers-reduced-motion: reduce)').matches)b.classList.add('wiggle')},4000)}
render();
</script>
</body>
</html>
