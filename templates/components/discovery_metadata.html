<meta name="description" content="{{ metadata.description }}">
{% if internal_document %}<meta name="robots" content="noindex, nofollow">{% endif %}
<link rel="canonical" href="{{ metadata.canonical_url }}">

<meta property="og:type" content="website">
<meta property="og:site_name" content="David Lybeck">
<meta property="og:title" content="{{ metadata.title }}">
<meta property="og:description" content="{{ metadata.description }}">
<meta property="og:url" content="{{ metadata.canonical_url }}">
<meta property="og:image" content="{{ metadata.social_image_url }}">
<meta property="og:image:type" content="image/webp">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{ metadata.social_image_alt }}">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ metadata.title }}">
<meta name="twitter:description" content="{{ metadata.description }}">
<meta name="twitter:image" content="{{ metadata.social_image_url }}">
<meta name="twitter:image:alt" content="{{ metadata.social_image_alt }}">
