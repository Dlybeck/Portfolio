<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% block title %}
    {% endblock %}
    {% include "components/discovery_metadata.html" %}
    <link rel="stylesheet" href="/static/css/page.css">
    <link rel="stylesheet" href="/static/css/motion.css?v=1">
  </head>
  <body>
    {% block content %}
    {% endblock %}
    <button onclick="toTop()" id="topBtn" title="Go to top">Top</button>
    
    {% block scripts %}
    {% endblock %}
    <script src="/static/scripts/mini-pages/backToTop.js?v=2" type="text/javascript"></script>
    <script src="/static/scripts/mini-pages/handleRoutes.js?v=2" type="text/javascript"></script>
    <script>
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        document.querySelectorAll('model-viewer[auto-rotate]').forEach((model) => {
          model.removeAttribute('auto-rotate');
        });
      }
    </script>
  </body>
</html>
