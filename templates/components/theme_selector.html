{% if theme_selector_enabled %}
<div class="home-theme-selector" data-home-theme-selector role="group" aria-label="Theme">
  <span class="home-theme-caption" aria-hidden="true">Theme</span>
  <div class="home-theme-dial">
    <button type="button" data-theme-step="-1" aria-label="Previous theme" tabindex="-1">‹</button>
    <span class="home-theme-name" data-theme-name aria-live="polite" aria-atomic="true">{% for theme in board_themes %}{% if theme.key == active_theme %}{{ theme.label }}{% endif %}{% endfor %}</span>
    <button type="button" data-theme-step="1" aria-label="Next theme" aria-keyshortcuts="Alt+T" tabindex="-1">›</button>
  </div>
</div>
{% endif %}
