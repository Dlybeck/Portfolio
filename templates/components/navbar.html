<nav class="navbar">
  <div class="navbar-content">
    <img src="/static/images/Logo.webp" alt="David Lybeck logo" class="navbar-logo">
    <div class="navbar-title">David Lybeck</div>
    <button type="button" class="home-button" aria-label="Home" tabindex="-1" onclick="returnHome()">
      <img src="/static/images/home.webp" alt="">
    </button>
    {% if theme_selector_enabled %}
    <label class="theme-selector">
      <span>Theme</span>
      <select data-theme-selector aria-label="Board theme" aria-keyshortcuts="Alt+T" tabindex="-1">
        {% for theme in board_themes %}
        <option class="theme-selector-option" value="{{ theme.key }}"{% if theme.key == active_theme %} selected{% endif %}>{{ theme.label }}</option>
        {% endfor %}
      </select>
    </label>
    {% endif %}
  </div>
</nav>
